<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowL4">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bgLight4)"/>
  <rect x="1" y="1" width="958" height="518" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">PROPOSED SOLUTION — FOUR ARCHITECTURAL PILLARS</text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">Sahyog ResQConnect Integrated Disaster Management Ecosystem</text>

  <!-- Central Hub Badge -->
  <g transform="translate(370, 85)">
    <rect width="220" height="50" rx="25" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadowL4)"/>
    <text x="110" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#0369a1">SAHYOG RESQCONNECT</text>
    <text x="110" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">Unified Crisis Orchestration</text>
  </g>

  <!-- Connective Axis Lines -->
  <line x1="240" y1="240" x2="480" y2="135" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="720" y1="240" x2="480" y2="135" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="240" y1="360" x2="480" y2="135" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="720" y1="360" x2="480" y2="135" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ── 4 PILLAR CARDS (2x2 Grid) ── -->
  <!-- Pillar 1: Offline Comm -->
  <g transform="translate(40, 160)">
    <rect width="420" height="135" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadowL4)"/>
    <rect x="0" y="0" width="420" height="28" rx="8" fill="#0284c7"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff">01. OFFLINE EMERGENCY COMMUNICATION</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0369a1">BLE Mesh + Local Store-and-Forward Sync</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• SQLite encrypted local database queues victim distress packets.</text>
    <text x="20" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Peer-to-peer Bluetooth Low Energy mesh relays packets across hops.</text>
    <text x="20" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Auto-flushes deduplicated alerts to cloud upon uplink restoration.</text>
  </g>

  <!-- Pillar 2: AI Triage -->
  <g transform="translate(500, 160)">
    <rect width="420" height="135" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#shadowL4)"/>
    <rect x="0" y="0" width="420" height="28" rx="8" fill="#7c3aed"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff">02. MULTIMODAL AI-ASSISTED TRIAGE</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#6d28d9">Gemini 2.5 Flash Vision &amp; Priority Engine</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Instant damage recognition from uploaded flood/collapse photos.</text>
    <text x="20" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Natural language voice extraction from panicked audio notes.</text>
    <text x="20" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Generates automated 1-10 PS8 priority scoring to prevent triage lag.</text>
  </g>

  <!-- Pillar 3: Command Center -->
  <g transform="translate(40, 315)">
    <rect width="420" height="135" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadowL4)"/>
    <rect x="0" y="0" width="420" height="28" rx="8" fill="#059669"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff">03. REAL-TIME GEOSPATIAL COMMAND HUB</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">Leaflet 2D Vectors + Cesium 3D Terrain</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Live tactical maps with dynamic animated radar ripple markers.</text>
    <text x="20" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Real-time K-Means cluster density &amp; high-risk sector overlays.</text>
    <text x="20" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Integrated 24/7 disaster news broadcasts &amp; IMD Doppler weather radar.</text>
  </g>

  <!-- Pillar 4: Relief Coordination -->
  <g transform="translate(500, 315)">
    <rect width="420" height="135" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadowL4)"/>
    <rect x="0" y="0" width="420" height="28" rx="8" fill="#d97706"/>
    <text x="20" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff">04. INTELLIGENT RELIEF COORDINATION</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#b45309">PostGIS Spatial Dispatch &amp; NGO Inventory</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Proximity-based ST_DWithin matching routes nearest active responders.</text>
    <text x="20" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• NGO supply hub stock tracking (food, water, medicine, shelters).</text>
    <text x="20" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Closed-loop assignment confirmation with photo proof verification.</text>
  </g>

  <!-- Innovation Strip -->
  <rect x="40" y="468" width="880" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">
    💡 INNOVATION: Offline-First BLE Mesh + Gemini Multimodal AI + 3D GIS Intelligence + Unified Multi-Agency Orchestration
  </text>
</svg>
