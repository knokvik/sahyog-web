<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowL2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowGreenL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#059669"/>
    </marker>
    <marker id="arrowBlueL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bgLight2)"/>
  <rect x="1" y="1" width="958" height="518" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">RESILIENCE WHEN THE NETWORK FAILS</text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">Normal Online Direct Path vs. Zero-Infrastructure Store-and-Forward BLE Mesh Relay</text>

  <!-- ── LEFT PANEL: NORMAL CONNECTIVITY ── -->
  <g transform="translate(40, 80)">
    <rect width="420" height="370" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowL2)"/>
    <rect x="0" y="0" width="420" height="34" rx="10" fill="#e2e8f0"/>
    <text x="210" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#334155" letter-spacing="0.8">SCENARIO A — NORMAL CONNECTIVITY</text>

    <!-- Node 1: Citizen -->
    <g transform="translate(135, 55)">
      <rect width="150" height="50" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="75" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Citizen Device</text>
      <text x="75" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Triggers SOS / Needs</text>
    </g>

    <line x1="210" y1="105" x2="210" y2="140" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreenL)"/>
    <text x="260" y="126" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669">4G / 5G / Wi-Fi</text>

    <!-- Node 2: Internet -->
    <g transform="translate(135, 145)">
      <rect width="150" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="75" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669">Internet Backbone</text>
      <text x="75" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Cloud Routing</text>
    </g>

    <line x1="210" y1="195" x2="210" y2="230" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreenL)"/>
    <text x="265" y="216" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669">REST / WSS</text>

    <!-- Node 3: Cloud -->
    <g transform="translate(135, 235)">
      <rect width="150" height="50" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="75" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Sahyog Cloud</text>
      <text x="75" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Orchestrator + AI</text>
    </g>

    <line x1="210" y1="285" x2="210" y2="310" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreenL)"/>

    <!-- Node 4: Command Center -->
    <g transform="translate(115, 315)">
      <rect width="190" height="42" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <text x="95" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#059669">Disaster Command Center</text>
    </g>
  </g>

  <!-- ── RIGHT PANEL: OFFLINE DISASTER MODE ── -->
  <g transform="translate(500, 80)">
    <rect width="420" height="370" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadowL2)"/>
    <rect x="0" y="0" width="420" height="34" rx="10" fill="#fee2e2"/>
    <text x="210" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b" letter-spacing="0.8">SCENARIO B — INFRASTRUCTURE COLLAPSE (OFFLINE)</text>

    <!-- Step 1: Citizen Offline -->
    <g transform="translate(20, 50)">
      <rect width="140" height="48" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">1. Victim SOS</text>
      <text x="70" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Saved to SQLite DB</text>
    </g>

    <line x1="160" y1="74" x2="200" y2="74" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlueL)"/>
    <text x="180" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#0284c7">BLE</text>

    <!-- Step 2: Peer Mesh Hop -->
    <g transform="translate(205, 50)">
      <rect width="195" height="48" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="97" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284c7">2. Nearby Responders</text>
      <text x="97" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Multi-Hop BLE Mesh Codec</text>
    </g>

    <line x1="302" y1="98" x2="302" y2="130" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlueL)"/>
    <text x="345" y="118" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#0284c7">LoRa / Mesh</text>

    <!-- Step 3: Gateway Hub -->
    <g transform="translate(180, 135)">
      <rect width="220" height="52" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="110" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d97706">3. Relief Gateway / Drone Node</text>
      <text x="110" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Caches Batched Sync Payload</text>
    </g>

    <line x1="290" y1="187" x2="290" y2="225" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreenL)"/>
    <text x="345" y="210" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#059669">Uplink Restored</text>

    <!-- Step 4: Sahyog Cloud Flush -->
    <g transform="translate(180, 230)">
      <rect width="220" height="50" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="110" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">4. Sahyog Cloud Sync Engine</text>
      <text x="110" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Deduplication + Auto-Ingest</text>
    </g>

    <line x1="290" y1="280" x2="290" y2="310" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreenL)"/>

    <!-- Step 5: Command Center Dispatch -->
    <g transform="translate(115, 315)">
      <rect width="285" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="142" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">Dispatched to Rescue Teams</text>
    </g>
  </g>

  <!-- Bottom Highlight Strip -->
  <rect x="40" y="465" width="880" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="489" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7">
    ⭐ Core Principle: "An emergency message should never disappear simply because the internet does."
  </text>
</svg>
