      <text x="80" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b45309">PostgreSQL 16</text>
      <rect x="175" width="160" height="40" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="255" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b45309">PostGIS Spatial</text>
      <rect x="350" width="160" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="430" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Redis Geo &amp; Cache</text>
      <rect x="525" width="160" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="605" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Supabase S3 Bucket</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="480" y="515" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">
    Fully decoupled micro-services architecture • 100% open standards • Scalable horizontal failover
  </text>
</svg>
