      <text x="622" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Twilio Voice/SMS</text>
    </g>
  </g>

  <!-- Layer 3: Backend & Core Services -->
  <g transform="translate(40, 244)">
