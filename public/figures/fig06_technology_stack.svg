<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowL6">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="16" fill="url(#bgLight6)"/>
  <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">MODULAR 5-LAYER TECHNOLOGY STACK</text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">Enterprise Resilience, Multi-Modal AI, Real-Time WebSockets &amp; Spatial Database Architecture</text>

  <!-- Layer 1: Presentation -->
  <g transform="translate(40, 80)">
    <rect width="880" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadowL6)"/>
    <rect x="0" y="0" width="160" height="72" rx="10" fill="#2563eb"/>
    <text x="80" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff">LAYER 1</text>
    <text x="80" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dbeafe">Presentation</text>

    <g transform="translate(180, 16)">
      <rect width="125" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="62" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Flutter (Dart)</text>
      <rect x="140" width="125" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="202" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">React 18 + Vite</text>
      <rect x="280" width="125" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="342" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Leaflet.js</text>
      <rect x="420" width="125" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="482" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">CesiumJS 3D</text>
      <rect x="560" width="125" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="622" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Redux Toolkit</text>
    </g>
  </g>

  <!-- Layer 2: Communication -->
  <g transform="translate(40, 162)">
    <rect width="880" height="72" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5" filter="url(#shadowL6)"/>
    <rect x="0" y="0" width="160" height="72" rx="10" fill="#0891b2"/>
    <text x="80" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff">LAYER 2</text>
