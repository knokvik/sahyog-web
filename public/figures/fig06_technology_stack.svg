      <text x="342" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Location Service</text>
      <rect x="420" width="125" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="482" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Heatmap Engine</text>
      <rect x="560" width="125" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="622" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Clerk Auth SDK</text>
    </g>
  </g>

  <!-- Layer 4: Intelligence & AI -->
  <g transform="translate(40, 326)">
    <rect width="880" height="72" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#shadowL6)"/>
    <rect x="0" y="0" width="160" height="72" rx="10" fill="#7c3aed"/>
