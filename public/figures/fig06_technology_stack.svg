      <text x="62" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Node.js / Express</text>
      <rect x="140" width="125" height="40" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="202" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#059669">Orchestrator</text>
