      <rect x="175" width="160" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="255" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Multimodal Vision Triage</text>
      <rect x="350" width="160" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="430" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Audio Speech-to-Text</text>
      <rect x="525" width="160" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="605" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">PS8 Scoring Model</text>
    </g>
  </g>

  <!-- Layer 5: Data & Spatial Layer -->
  <g transform="translate(40, 408)">
    <rect width="880" height="72" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadowL6)"/>
    <rect x="0" y="0" width="160" height="72" rx="10" fill="#d97706"/>
    <text x="80" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff">LAYER 5</text>
    <text x="80" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fef3c7">Data Layer</text>

