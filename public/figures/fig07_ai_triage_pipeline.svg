<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowL7">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowAiL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="960" height="500" rx="16" fill="url(#bgLight7)"/>
  <rect x="1" y="1" width="958" height="498" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">AI-ASSISTED MULTIMODAL EMERGENCY TRIAGE PIPELINE</text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">Gemini 2.5 Flash Processing • Cognitive Load Reduction • Structured Escalation</text>

  <!-- ── PIPELINE FLOW (Horizontal Sequence) ── -->
  <!-- Box 1: Raw Ingestion Inputs -->
  <g transform="translate(40, 95)">
    <rect width="150" height="260" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadowL7)"/>
    <rect x="0" y="0" width="150" height="28" rx="8" fill="#2563eb"/>
    <text x="75" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fff">1. RAW INPUTS</text>
    
    <g transform="translate(10, 40)">
      <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">📷 Disaster Photos</text>
      <text x="65" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Flood/Collapse view</text>
    </g>
    <g transform="translate(10, 95)">
      <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">🎙️ Audio Voice Note</text>
      <text x="65" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Panicked speech</text>
    </g>
    <g transform="translate(10, 150)">
      <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">📝 Text SOS Report</text>
      <text x="65" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Needs &amp; trapped count</text>
    </g>
    <g transform="translate(10, 205)">
      <rect width="130" height="45" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="65" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">📍 GPS Telemetry</text>
      <text x="65" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Elevation &amp; accuracy</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="200" y1="225" x2="230" y2="225" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowAiL)"/>

  <!-- Box 2: Gemini 2.5 Flash Processing -->
  <g transform="translate(240, 95)">
    <rect width="210" height="260" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2" filter="url(#shadowL7)"/>
    <rect x="0" y="0" width="210" height="28" rx="8" fill="#7c3aed"/>
    <text x="105" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff">2. GEMINI 2.5 FLASH AI</text>

    <g transform="translate(15, 45)">
      <rect width="180" height="60" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6d28d9">Visual Feature Analysis</text>
      <text x="90" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• Water level height (cm)</text>
      <text x="90" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• Structural collapse risk</text>
    </g>

    <g transform="translate(15, 115)">
      <rect width="180" height="60" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6d28d9">Audio NLP Extraction</text>
      <text x="90" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• Urgent medical keywords</text>
      <text x="90" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• Trapped count estimation</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="180" height="60" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6d28d9">Synthetic Brief Synthesis</text>
      <text x="90" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 2-sentence operator card</text>
      <text x="90" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• PS8 Priority formula</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="460" y1="225" x2="490" y2="225" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowAiL)"/>

  <!-- Box 3: Structured Assessment Outputs -->
  <g transform="translate(500, 95)">
    <rect width="200" height="260" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadowL7)"/>
    <rect x="0" y="0" width="200" height="28" rx="8" fill="#d97706"/>
    <text x="100" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fff">3. STRUCTURED TRIAGE</text>

    <!-- Score Card -->
    <g transform="translate(15, 45)">
      <rect width="170" height="90" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">SEVERITY RATING</text>
      <text x="85" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#dc2626">CRITICAL (9.4)</text>
      <text x="85" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Life Threat • Immediate Evac</text>
    </g>

    <!-- Classification -->
    <g transform="translate(15, 145)">
      <rect width="170" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0284c7">Tagged Needs:</text>
      <text x="15" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• Inflatable Boat Required</text>
      <text x="15" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• 2 Elderly, 1 Infant</text>
      <text x="15" y="74" font-family="system-ui, sans-serif" font-size="9" fill="#334155">• Severe Hypothermia Risk</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="710" y1="225" x2="740" y2="225" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowAiL)"/>

  <!-- Box 4: Human-in-the-Loop Action -->
  <g transform="translate(750, 95)">
    <rect width="170" height="260" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadowL7)"/>
    <rect x="0" y="0" width="170" height="28" rx="8" fill="#059669"/>
    <text x="85" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fff">4. HUMAN DECISION</text>

    <g transform="translate(15, 45)">
      <rect width="140" height="60" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1"/>
      <text x="70" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#047857">Coordinator Review</text>
      <text x="70" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">1-Click Dispatch Approval</text>
    </g>

    <g transform="translate(15, 115)">
      <rect width="140" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
      <text x="70" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#1d4ed8">Auto-Routing</text>
      <text x="70" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Alert Nearest Boat Squad</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="140" height="60" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
      <text x="70" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#b45309">Resource Allocation</text>
      <text x="70" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Deduct from Hub Stock</text>
    </g>
  </g>

  <!-- Ethical Human-in-the-Loop Statement -->
  <rect x="40" y="380" width="880" height="90" rx="8" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="480" y="412" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#4338ca">
    🛡️ ETHICAL AI DESIGN: "AI ASSISTS, HUMANS DECIDE"
  </text>
  <text x="480" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#334155">
    The AI does not make life-or-death decisions unilaterally — it digests chaotic multimodal inputs into structured priorities,
  </text>
  <text x="480" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">
    reducing emergency operator cognitive lag from 20 minutes to under 5 seconds during high-volume crisis surges.
  </text>
</svg>
