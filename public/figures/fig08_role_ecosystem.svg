<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowL8">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bgLight8)"/>
  <rect x="1" y="1" width="958" height="518" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">STAKEHOLDER &amp; ROLE COLLABORATION ECOSYSTEM</text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">One Unified Response Platform Connecting All Disaster Response Stakeholders</text>

  <!-- Central Platform Node -->
  <g transform="translate(360, 195)">
    <rect width="240" height="90" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5" filter="url(#shadowL8)"/>
    <text x="120" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0369a1">SAHYOG PLATFORM</text>
    <text x="120" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#334155">Unified Real-Time Event Bus</text>
    <text x="120" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Auth • Spatial RBAC • WebSockets</text>
  </g>

  <!-- Connectors to Central Hub -->
  <line x1="480" y1="140" x2="480" y2="195" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="240" y1="330" x2="360" y2="260" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="720" y1="330" x2="600" y2="260" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="480" y1="345" x2="480" y2="285" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- ── 4 ROLE SATELLITES ── -->
  <!-- Role 1: Citizens (Top Center) -->
  <g transform="translate(340, 75)">
    <rect width="280" height="65" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadowL8)"/>
    <rect x="0" y="0" width="280" height="22" rx="8" fill="#dc2626"/>
    <text x="140" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fff">👥 CITIZENS &amp; AFFECTED VICTIMS</text>
    <text x="140" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">• 1-Tap SOS Distress Trigger</text>
    <text x="140" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• Submit Multimodal Reports &amp; Missing Persons</text>
  </g>

  <!-- Role 2: Volunteers (Bottom Left) -->
  <g transform="translate(40, 330)">
    <rect width="270" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadowL8)"/>
    <rect x="0" y="0" width="270" height="24" rx="8" fill="#2563eb"/>
    <text x="135" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fff">🚑 VOLUNTEERS &amp; FIRST RESPONDERS</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Receive Proximity Push Alerts</text>
    <text x="20" y="66" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Live Turn-by-Turn GPS Navigation</text>
    <text x="20" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Submit Photo / Resolution Proof</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• Peer BLE Mesh Relay Nodes</text>
  </g>

  <!-- Role 3: Coordinators (Bottom Center) -->
  <g transform="translate(345, 345)">
    <rect width="270" height="110" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadowL8)"/>
    <rect x="0" y="0" width="270" height="24" rx="8" fill="#059669"/>
    <text x="135" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fff">🎯 DISASTER COMMAND COORDINATORS</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Review AI Triage Priority Scores</text>
    <text x="20" y="66" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• 1-Click Multi-Squad Dispatch</text>
    <text x="20" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Hazard Zone Declaration &amp; Geofencing</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• National Hotline Integration (112)</text>
  </g>

  <!-- Role 4: NGOs & Relief Agencies (Bottom Right) -->
  <g transform="translate(650, 330)">
    <rect width="270" height="110" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadowL8)"/>
    <rect x="0" y="0" width="270" height="24" rx="8" fill="#d97706"/>
    <text x="135" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fff">📦 NGOs &amp; RELIEF ORGANIZATIONS</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Manage Supply Hubs &amp; Warehouses</text>
    <text x="20" y="66" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Track Live Inventory (Rations, Meds)</text>
    <text x="20" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Manage Volunteer Camps &amp; Shifts</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• Real-Time Need Matching Delivery</text>
  </g>

  <!-- Bottom Strip -->
  <rect x="40" y="475" width="880" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="495" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369a1">
    Decentralized Collaboration Network • Zero Friction Data Flow • Complete Incident Lifecycle Traceability
  </text>
</svg>
